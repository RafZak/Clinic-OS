<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" font-family="Inter, -apple-system, sans-serif">
  <defs>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#CC0641"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/>
    </marker>
    <marker id="arrow-back" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M10,0 L0,5 L10,10 z" fill="#CC0641"/>
    </marker>
    <marker id="arrow-back-gray" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M10,0 L0,5 L10,10 z" fill="#6B7280"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="#FFFFFF"/>

  <!-- Header -->
  <text x="80" y="80" font-size="36" font-weight="700" fill="#1A1A1A">Clinic OS plugs into your tools — nothing gets replaced</text>
  <text x="80" y="118" font-size="20" font-weight="400" fill="#6B7280">An intelligence layer that connects to what your teams already use every day</text>
  <line x1="80" y1="148" x2="1840" y2="148" stroke="#E5E7EB" stroke-width="1"/>

  <!-- ============ LEFT COLUMN — AMPLIFON STACK ============ -->
  <text x="80" y="200" font-size="14" font-weight="600" fill="#6B7280" letter-spacing="2">YOUR CURRENT TOOLS</text>
  <rect x="80" y="220" width="520" height="720" fill="#F5F7F8" rx="12"/>

  <!-- Salesforce Service Cloud -->
  <rect x="110" y="250" width="460" height="100" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" rx="8"/>
  <image x="128" y="278" width="44" height="44" preserveAspectRatio="xMidYMid meet" href="data:image/png;base64,"/>
  <text x="190" y="290" font-size="18" font-weight="600" fill="#1A1A1A">Salesforce Service Cloud</text>
  <text x="190" y="315" font-size="14" fill="#6B7280">Every patient's record</text>
  <text x="190" y="335" font-size="12" fill="#9CA3AF">Appointments, history, contacts, follow-ups</text>

  <!-- Salesforce Agentforce -->
  <rect x="110" y="370" width="460" height="100" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" rx="8"/>
  <image x="128" y="398" width="44" height="44" preserveAspectRatio="xMidYMid meet" href="data:image/png;base64,"/>
  <text x="190" y="410" font-size="18" font-weight="600" fill="#1A1A1A">Salesforce Agentforce</text>
  <text x="190" y="435" font-size="14" fill="#6B7280">The AI agent that books appointments</text>
  <text x="190" y="455" font-size="12" fill="#9CA3AF">Patient reminders, recommendations</text>

  <!-- Amplifon 360 / Field Service (rolling out) -->
  <g opacity="0.25">
  <rect x="110" y="490" width="460" height="100" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" rx="8"/>
  <image x="128" y="518" width="44" height="44" preserveAspectRatio="xMidYMid meet" href="data:image/png;base64,"/>
  <text x="190" y="530" font-size="18" font-weight="600" fill="#1A1A1A">Amplifon 360</text>
  <text x="190" y="555" font-size="14" fill="#6B7280">The mobile app for hearing care professionals</text>
  <text x="190" y="575" font-size="12" fill="#9CA3AF">Appointment prep and follow-up</text>
  </g>

  <!-- NOAH 4 -->
  <rect x="110" y="610" width="460" height="100" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" rx="8"/>
  <rect x="130" y="620" width="40" height="80" fill="#1A1A1A" rx="6"/>
  <text x="150" y="666" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">N4</text>
  <text x="190" y="650" font-size="18" font-weight="600" fill="#1A1A1A">NOAH 4</text>
  <text x="190" y="675" font-size="14" fill="#6B7280">The software that fits hearing aids</text>
  <text x="190" y="695" font-size="12" fill="#9CA3AF">Measurements, audiograms, adjustments</text>

  <!-- IDM Audio -->
  <rect x="110" y="730" width="460" height="100" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" rx="8"/>
  <rect x="130" y="740" width="40" height="80" fill="#0066CC" rx="6"/>
  <text x="150" y="786" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">IDM</text>
  <text x="190" y="770" font-size="18" font-weight="600" fill="#1A1A1A">IDM Audio</text>
  <text x="190" y="795" font-size="14" fill="#6B7280">Day-to-day store management</text>
  <text x="190" y="815" font-size="12" fill="#9CA3AF">Quotes, invoicing, inventory</text>

  <!-- ToolsGroup SO99+ -->
  <rect x="110" y="850" width="460" height="70" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" rx="8"/>
  <text x="130" y="880" font-size="14" font-weight="600" fill="#1A1A1A">ToolsGroup SO99+</text>
  <text x="130" y="902" font-size="12" fill="#9CA3AF">Per-store stock forecasting — not part of the integration</text>

  <!-- ============ MIDDLE COLUMN — INTEGRATION FLOWS ============ -->
  <text x="700" y="200" font-size="14" font-weight="600" fill="#CC0641" letter-spacing="2">WHAT FLOWS BETWEEN THEM</text>

  <!-- Flow 1 : Service Cloud bidirectional -->
  <line x1="600" y1="300" x2="1320" y2="300" stroke="#CC0641" stroke-width="2.5" marker-end="url(#arrow-red)" marker-start="url(#arrow-back)"/>
  <rect x="700" y="270" width="520" height="22" fill="#FFFFFF" stroke="#CC0641" stroke-width="1" rx="11"/>
  <text x="960" y="285" font-size="12" font-weight="600" fill="#CC0641" text-anchor="middle">Consultation reports land directly in the patient record</text>

  <!-- Flow 2 : Agentforce bidirectional (signal handoff) -->
  <line x1="600" y1="420" x2="1320" y2="420" stroke="#6B7280" stroke-width="1.5" stroke-dasharray="6,4" marker-start="url(#arrow-back-gray)" marker-end="url(#arrow-gray)"/>
  <text x="960" y="412" font-size="11" font-style="italic" fill="#6B7280" text-anchor="middle">When an appointment is booked, Clinic OS surfaces the history, past notes and follow-up points</text>

  <!-- Flow 3 : Amplifon 360 embed (rolling out) -->
  <g opacity="0.25">
  <line x1="600" y1="540" x2="1320" y2="540" stroke="#6B7280" stroke-width="1.5" stroke-dasharray="6,4" marker-start="url(#arrow-back-gray)" marker-end="url(#arrow-gray)"/>
  <text x="960" y="532" font-size="11" font-style="italic" fill="#6B7280" text-anchor="middle">Coaching will appear inside the Amplifon 360 app (no screen switching)</text>
  </g>

  <!-- Flow 4 : NOAH session linkage -->
  <line x1="600" y1="660" x2="1320" y2="660" stroke="#6B7280" stroke-width="1.5" stroke-dasharray="6,4" marker-start="url(#arrow-back-gray)" marker-end="url(#arrow-gray)"/>
  <text x="960" y="652" font-size="11" font-style="italic" fill="#6B7280" text-anchor="middle">Audio measurements stay inside NOAH — we don't touch a thing</text>

  <!-- Flow 5 : IDM Audio (read-only) -->
  <line x1="600" y1="780" x2="1320" y2="780" stroke="#6B7280" stroke-width="1.5" stroke-dasharray="6,4" marker-start="url(#arrow-back-gray)" marker-end="url(#arrow-gray)"/>
  <text x="960" y="772" font-size="11" font-style="italic" fill="#6B7280" text-anchor="middle">Read-only access to figures that feed your dashboards</text>

  <!-- ============ RIGHT COLUMN — CLINIC OS ============ -->
  <text x="1320" y="200" font-size="14" font-weight="600" fill="#CC0641" letter-spacing="2">CLINIC OS</text>
  <rect x="1320" y="220" width="520" height="720" fill="#CC0641" rx="12"/>

  <text x="1580" y="270" font-size="28" font-weight="800" fill="#FFFFFF" text-anchor="middle">Clinic OS</text>
  <text x="1580" y="298" font-size="14" font-weight="400" fill="#FFFFFF" opacity="0.85" text-anchor="middle">The AI that lifts your entire network</text>

  <line x1="1360" y1="320" x2="1800" y2="320" stroke="#FFFFFF" stroke-width="1" opacity="0.3"/>

  <!-- Module 1 : Pillar 2 Coaching -->
  <rect x="1350" y="345" width="460" height="100" fill="#FFFFFF" rx="8"/>
  <rect x="1370" y="365" width="6" height="60" fill="#CC0641" rx="3"/>
  <text x="1390" y="380" font-size="11" font-weight="700" fill="#CC0641" letter-spacing="1.5">COACHING</text>
  <text x="1390" y="403" font-size="17" font-weight="600" fill="#1A1A1A">Supports consultations and calls</text>
  <text x="1390" y="425" font-size="13" fill="#6B7280">Listens, scores the key steps, spots what works</text>
  <text x="1390" y="442" font-size="13" fill="#6B7280">and what's lost — quantified in euros</text>

  <!-- Module 2 : Pillar 1 Knowledge -->
  <rect x="1350" y="465" width="460" height="100" fill="#FFFFFF" rx="8"/>
  <rect x="1370" y="485" width="6" height="60" fill="#CC0641" rx="3"/>
  <text x="1390" y="500" font-size="11" font-weight="700" fill="#CC0641" letter-spacing="1.5">KNOWLEDGE</text>
  <text x="1390" y="523" font-size="17" font-weight="600" fill="#1A1A1A">Search across all your training content</text>
  <text x="1390" y="545" font-size="13" fill="#6B7280">Ask your question in plain English, get the answer</text>
  <text x="1390" y="562" font-size="13" fill="#6B7280">+ the training video at the exact timestamp</text>

  <!-- Module 3 : Organizational Vault -->
  <rect x="1350" y="585" width="460" height="100" fill="#FFFFFF" rx="8"/>
  <rect x="1370" y="605" width="6" height="60" fill="#CC0641" rx="3"/>
  <text x="1390" y="620" font-size="11" font-weight="700" fill="#CC0641" letter-spacing="1.5">MEMORY</text>
  <text x="1390" y="643" font-size="17" font-weight="600" fill="#1A1A1A">A living memory of your network</text>
  <text x="1390" y="665" font-size="13" fill="#6B7280">Every consultation enriches the collective knowledge</text>
  <text x="1390" y="682" font-size="13" fill="#6B7280">Exportable, readable, never a black box</text>

  <!-- Module 4 : Artifacts -->
  <rect x="1350" y="705" width="460" height="100" fill="#FFFFFF" rx="8"/>
  <rect x="1370" y="725" width="6" height="60" fill="#CC0641" rx="3"/>
  <text x="1390" y="740" font-size="11" font-weight="700" fill="#CC0641" letter-spacing="1.5">DELIVERABLES</text>
  <text x="1390" y="763" font-size="17" font-weight="600" fill="#1A1A1A">4 documents ready after every consultation</text>
  <text x="1390" y="785" font-size="13" fill="#6B7280">Clinical notes, patient email, SMS, ENT letter</text>
  <text x="1390" y="802" font-size="13" fill="#6B7280">→ pushed automatically into the Salesforce record</text>

  <!-- Hosting badge -->
  <rect x="1350" y="825" width="460" height="95" fill="#FFFFFF" opacity="0.15" rx="8"/>
  <text x="1370" y="853" font-size="12" font-weight="700" fill="#FFFFFF" letter-spacing="1.5">HOSTING</text>
  <text x="1370" y="877" font-size="14" font-weight="500" fill="#FFFFFF">European servers, GDPR-compliant</text>
  <text x="1370" y="897" font-size="13" fill="#FFFFFF" opacity="0.85">Patient data stays inside your Salesforce</text>
  <text x="1370" y="914" font-size="13" fill="#FFFFFF" opacity="0.85">Health-data certified hosting planned for production</text>

  <!-- ============ FOOTER — TRUST CAPSULES ============ -->
  <line x1="80" y1="975" x2="1840" y2="975" stroke="#E5E7EB" stroke-width="1"/>

  <!-- Capsule 1 -->
  <rect x="80" y="1000" width="560" height="60" fill="#F5F7F8" rx="30"/>
  <circle cx="120" cy="1030" r="16" fill="#CC0641"/>
  <text x="120" y="1036" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="155" y="1024" font-size="14" font-weight="600" fill="#1A1A1A">Your IT stays in control</text>
  <text x="155" y="1045" font-size="12" fill="#6B7280">Login via your existing Amplifon credentials</text>

  <!-- Capsule 2 -->
  <rect x="680" y="1000" width="560" height="60" fill="#F5F7F8" rx="30"/>
  <circle cx="720" cy="1030" r="16" fill="#CC0641"/>
  <text x="720" y="1036" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="755" y="1024" font-size="14" font-weight="600" fill="#1A1A1A">Your patient data stays with you</text>
  <text x="755" y="1045" font-size="12" fill="#6B7280">No sensitive data ever leaves your servers</text>

  <!-- Capsule 3 -->
  <rect x="1280" y="1000" width="560" height="60" fill="#F5F7F8" rx="30"/>
  <circle cx="1320" cy="1030" r="16" fill="#CC0641"/>
  <text x="1320" y="1036" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="1355" y="1024" font-size="14" font-weight="600" fill="#1A1A1A">Switch on and off with one click</text>
  <text x="1355" y="1045" font-size="12" fill="#6B7280">You decide when to start, you decide when to stop</text>

</svg>
